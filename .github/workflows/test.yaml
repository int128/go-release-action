name: test

on:
  pull_request:
    paths:
      - .github/workflows/test.yaml
      - fixture/**
      - action.yaml
  push:
    branches:
      - v2
    paths:
      - .github/workflows/test.yaml
      - fixture/**
      - action.yaml
    tags:
      - test/release/*

concurrency:
  cancel-in-progress: true
  group: ${{ github.workflow }}--${{ github.ref }}

jobs:
  create:
    runs-on: ubuntu-slim
    timeout-minutes: 10
    outputs:
      draft-release-name: ${{ steps.create-draft-release.outputs.draft-release-name }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Run int128/go-release-action/create-draft-release
        id: create-draft-release
        uses: ./create-draft-release

  upload:
    needs: create
    strategy:
      fail-fast: false
      matrix:
        platform:
          - runs-on: ubuntu-latest
            GOOS: linux
            GOARCH: amd64
          - runs-on: macos-latest
            GOOS: darwin
            GOARCH: amd64
          - runs-on: windows-latest
            GOOS: windows
            GOARCH: amd64
    runs-on: ${{ matrix.platform.runs-on }}
    env:
      GOOS: ${{ matrix.platform.GOOS }}
      GOARCH: ${{ matrix.platform.GOARCH }}
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version-file: fixture/go.mod
      - run: go build
        working-directory: fixture
      - name: Run int128/go-release-action
        id: upload
        uses: ./
        with:
          working-directory: fixture
          binary: fixture
          release-name: ${{ needs.create.outputs.draft-release-name }}
      - run: zipinfo "$zip_name"
        working-directory: fixture
        shell: bash
        env:
          zip_name: ${{ steps.upload.outputs.zip-name }}
