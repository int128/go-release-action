name: test

on:
  pull_request:
    paths:
      - .github/workflows/test.yaml
      - fixture/**
      - action.yaml
  push:
    branches:
      - v2
    tags:
      - test/release/*
    paths:
      - .github/workflows/test.yaml
      - fixture/**
      - action.yaml
  workflow_dispatch:
    inputs:
      release-name:
        description: Name to create a draft release (e.g. test/release/0)
        type: string
        required: true

jobs:
  draft:
    runs-on: ubuntu-slim
    timeout-minutes: 10
    permissions:
      contents: write
    outputs:
      release-name: ${{ steps.create-release.outputs.release-name }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - if: github.event_name == 'workflow_dispatch' || github.ref_type == 'tag'
        id: create-release
        run: |
          if gh release view "$release_name"; then
            exit
          fi
          gh release create --draft --target "$GITHUB_SHA" --title "$release_name" "$release_name"
          echo "release-name=$release_name" >> "$GITHUB_OUTPUT"
        env:
          release_name: ${{ inputs.release-name || github.ref_name }}
          GITHUB_TOKEN: ${{ github.token }}

  upload:
    needs: draft
    strategy:
      fail-fast: false
      matrix:
        platform:
          - runs-on: ubuntu-latest
            GOOS: linux
            GOARCH: amd64
          - runs-on: macos-latest
            GOOS: darwin
            GOARCH: amd64
          - runs-on: windows-latest
            GOOS: windows
            GOARCH: amd64
    runs-on: ${{ matrix.platform.runs-on }}
    env:
      GOOS: ${{ matrix.platform.GOOS }}
      GOARCH: ${{ matrix.platform.GOARCH }}
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version-file: fixture/go.mod
      - run: go build
        working-directory: fixture
      - name: Run int128/go-release-action
        id: go-release-action
        uses: ./
        with:
          working-directory: fixture
          binary: fixture
          release-name: ${{ needs.draft.outputs.release-name }}
      - run: zipinfo "$zip_name"
        working-directory: fixture
        shell: bash
        env:
          zip_name: ${{ steps.go-release-action.outputs.zip-name }}
